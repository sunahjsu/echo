# DVC流水线定义
stages:
  prepare:
    cmd: python prepare_data.py
    deps:
      - prepare_data.py
      - ${data.path}
    params:
      - data.path
      - preprocess.image_size
      - preprocess.grayscale
      - preprocess.normalize
    outs:
      - data/processed/images.npy
      - data/processed/labels.npy
      - data/processed/image_paths.pkl

  train_pca:
    cmd: python train_pca.py
    deps:
      - train_pca.py
      - src/
      - data/processed/images.npy
    params:
      - pca.n_components
      - pca.random_state
    outs:
      - models/pca_model.pkl
      - models/scaler.pkl
      - data/processed/images_pca.npy
    metrics:
      - models/pca_metrics.json:
          cache: false

  evaluate:
    cmd: python evaluate_retrieval.py
    deps:
      - evaluate_retrieval.py
      - src/
      - data/processed/images.npy
      - data/processed/images_pca.npy
      - data/processed/labels.npy
    params:
      - retrieval.top_k
      - retrieval.distance_metric
      - evaluation.n_queries
      - evaluation.random_state
    metrics:
      - results/evaluation_metrics.json:
          cache: false
    plots:
      - results/accuracy_comparison.png:
          cache: false
      - results/speed_comparison.png:
          cache: false

  mlflow_track:
    cmd: python track_experiment.py
    deps:
      - track_experiment.py
      - src/
      - models/pca_model.pkl
      - results/evaluation_metrics.json
    params:
      - mlflow.tracking_uri
      - mlflow.experiment_name
    metrics:
      - mlruns/experiment_info.json:
          cache: false